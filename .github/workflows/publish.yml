# Restored 2026-09-03, adapted from the workflow commit f249a39 deleted when this
# app was pointed at Vercel. Its shape is deliberate and is shared with the other
# self-hosted Sliva site repos: verify, then build ONCE, then boot the exact bytes
# that were built, then push those same bytes. Nothing is rebuilt between the
# smoke test and the push.
#
# The `verify` job duplicates ci.yml's `quality` job rather than referencing it.
# That is intentional: a publish must not depend on another workflow's run
# completing, and a green image is worth two cheap minutes of overlap.
name: Publish Slivadoc Partners image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-slivadoc-partners-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/s-v2/slivadoc-partners

jobs:
  verify:
    name: Verify (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish:
    name: Build, smoke and push slivadoc-partners
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built ONCE, loaded into the local daemon, never pushed from here.
      # linux/amd64 matches both the runner and the deployment VM, so the loaded
      # image runs natively in the smoke step with no emulation.
      - name: Build (load, do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
          # Single-platform image: skip provenance/SBOM attestations so the pushed
          # tag is a plain image manifest rather than an index carrying an
          # unknown/unknown entry, which keeps `docker pull` on the VM simple and
          # keeps the digest in .env pointing at something inspectable.
          provenance: false

      - name: Report image size
        run: |
          set -euo pipefail
          BYTES="$(docker image inspect "${IMAGE}:${GITHUB_SHA}" --format '{{.Size}}')"
          echo "uncompressed size: ${BYTES} bytes ($((BYTES / 1048576)) MB)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The gate. Boots the image just built and asserts a real render. Every wait
      # is bounded, the container is always torn down, and its logs are always
      # dumped on failure.
      - name: Boot smoke test
        run: |
          set -euo pipefail

          IMAGE_REF="${IMAGE}:${GITHUB_SHA}"

          # Source the expected marker from the repo's own render test so this
          # workflow and tests/rendered-html.test.mjs cannot drift apart. The
          # first `assert.match(html, /.../)` in that file asserts against
          # app/partner-portal.tsx, and its patterns are user-visible page copy,
          # so the same pattern must appear in the served HTML.
          MARKER_JSON="$(node -e '
            const fs = require("node:fs");
            const src = fs.readFileSync("tests/rendered-html.test.mjs", "utf8");
            const m = src.match(/assert\.match\(\s*html\s*,\s*\/((?:[^\/\\\n]|\\.)+)\/([gimsuy]*)\s*\)/);
            if (!m) {
              console.error("could not source expected marker from tests/rendered-html.test.mjs");
              process.exit(1);
            }
            process.stdout.write(JSON.stringify({ pattern: m[1], flags: m[2] }));
          ')"
          echo "expected marker: ${MARKER_JSON}"

          cleanup() {
            echo "--- container logs ---"
            docker logs smoke 2>&1 || true
            echo "--- container state ---"
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' smoke 2>&1 || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name smoke -p 127.0.0.1:3000:3000 "$IMAGE_REF"

          # Poll GET / for up to 60s. Fail fast if the container exits, which is
          # exactly how a missing-standalone-output or bad-libc boot crash looks.
          ok=0
          for _ in $(seq 1 30); do
            if [ -z "$(docker ps -q --filter name=^smoke$ --filter status=running)" ]; then
              echo "::error::container exited before serving a request"
              exit 1
            fi
            code="$(curl -sS -o /tmp/smoke.html -D /tmp/smoke.head -w '%{http_code}' \
                      -m 10 http://127.0.0.1:3000/ 2>/dev/null || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::GET / never returned 200 within 60s (last code: ${code:-none})"
            exit 1
          fi

          if ! grep -iqE '^content-type:[[:space:]]*text/html' /tmp/smoke.head; then
            echo "::error::GET / did not return text/html"
            cat /tmp/smoke.head
            exit 1
          fi

          # A 200 alone is not enough: an error shell also returns 200.
          SMOKE_MARKER="$MARKER_JSON" node -e '
            const fs = require("node:fs");
            const { pattern, flags } = JSON.parse(process.env.SMOKE_MARKER);
            const re = new RegExp(pattern, flags);
            const html = fs.readFileSync("/tmp/smoke.html", "utf8");
            if (!re.test(html)) {
              console.error("::error::rendered HTML did not match /" + pattern + "/" + flags);
              console.error(html.slice(0, 2000));
              process.exit(1);
            }
            console.log("rendered HTML matched /" + pattern + "/" + flags);
          '

          # next/image is live on this page (the two logo marks are optimized;
          # only the hero sets `unoptimized`), so /_next/image has to work or the
          # brand disappears. It is also the one route that proves sharp's binary
          # matches the runtime libc — the failure this image's all-Alpine build
          # exists to prevent. Asserted here rather than trusted.
          SRC="$(node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("/tmp/smoke.html", "utf8");
            const m = html.match(/\/_next\/image\?url=[^"'\''\s]+/);
            process.stdout.write(m ? m[0].replace(/&amp;/g, "&") : "");
          ')"
          if [ -z "$SRC" ]; then
            echo "::error::no /_next/image request found in the rendered HTML"
            exit 1
          fi
          icode="$(curl -sS -o /tmp/img.bin -D /tmp/img.head -w '%{http_code}' \
                     -m 20 "http://127.0.0.1:3000${SRC}" 2>/dev/null || true)"
          if [ "$icode" != "200" ]; then
            echo "::error::image optimizer returned ${icode:-none} for ${SRC}"
            cat /tmp/img.head || true
            exit 1
          fi
          echo "image optimizer served ${SRC} ($(wc -c < /tmp/img.bin) bytes)"

          echo "boot smoke test passed" | tee -a "$GITHUB_STEP_SUMMARY"

      # Pushes the exact bytes that were just smoke-tested. No rebuild.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          DIGEST="$(docker image inspect "${IMAGE}:${GITHUB_SHA}" \
                     --format '{{index .RepoDigests 0}}')"
          echo "pushed ${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Repin PARTNERS_REF in the VM .env to @${DIGEST#*@}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
